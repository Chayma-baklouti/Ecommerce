services:
  backend:
    image: ecommerce-backend:latest
    pull_policy: never
    restart: unless-stopped
    ports:
      - "5000:3001"
    environment:
      SERVER_PORT: 3001
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"

      # Base de données
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      # JWT (CORRECTION : Spring cherche spring.app.jwtSecret)
      SPRING_APP_JWTSECRET: ${JWT_SECRET}
      SPRING_APP_JWTEXPIRATIONMS: ${JWT_EXPIRATION_MS:-172800000}
      SPRING_ECOM_APP_JWTCOOKIENAME: ${JWT_COOKIE_NAME:-springBootEcom}
      PROJECT_IMAGE: images/

      # Google OAuth2 (adapte les noms si tes propriétés sont personnalisées)
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # Mail
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
    volumes:
      - ./backend/images:/app/images
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    restart: unless-stopped
    command: >
      --innodb-buffer-pool-size=128M
      --performance-schema=OFF
      --max-connections=30
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    image: ecommerce-frontend:latest
    pull_policy: never
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data: