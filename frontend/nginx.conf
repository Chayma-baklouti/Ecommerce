# Ce fichier est inclus dans le bloc http{} de nginx : les zones peuvent être déclarées ici.

# --- Rate limiting -----------------------------------------------------------
limit_req_zone  $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=api_auth:10m    rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status  429;
limit_conn_status 429;

# --- Vraie IP du visiteur (Caddy envoie X-Real-IP, réseau Docker interne) -----
set_real_ip_from 172.16.0.0/12;
real_ip_header   X-Real-IP;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    limit_conn conn_per_ip 30;

    # Login, inscription, Google, mails : limite stricte (anti brute-force / spam d'emails)
    location /api/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reste de l'API : limite générale
    location /api/ {
        limit_req zone=api_general burst=30 nodelay;
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /images/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}