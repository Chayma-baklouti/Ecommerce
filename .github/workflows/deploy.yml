name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ecommerce-backend:latest ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_BACK_URL="${{ secrets.VITE_BACK_URL }}" \
            --build-arg VITE_BACK_END_URL="${{ secrets.VITE_BACK_END_URL }}" \
            --build-arg VITE_FRONTEND_URL="${{ secrets.VITE_FRONTEND_URL }}" \
            --build-arg VITE_STRIPE_PUBLISHABLE_KEY="${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}" \
            --build-arg VITE_PAYPAL_CLIENT_ID="${{ secrets.VITE_PAYPAL_CLIENT_ID }}" \
            --build-arg VITE_GOOGLE_CLIENT_ID="${{ secrets.VITE_GOOGLE_CLIENT_ID }}" \
            -t ecommerce-frontend:latest ./frontend

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Save images
        run: docker save ecommerce-backend:latest ecommerce-frontend:latest | gzip > images.tar.gz

      - name: Send images to the VM
        run: |
          scp images.tar.gz "$SSH_USER@$SSH_HOST:/tmp/images.tar.gz"
          ssh "$SSH_USER@$SSH_HOST" "gunzip -c /tmp/images.tar.gz | docker load && rm -f /tmp/images.tar.gz"

      - name: Deploy
        run: |
          ssh "$SSH_USER@$SSH_HOST" "mkdir -p $DEPLOY_PATH/backend/images; if [ -d $DEPLOY_PATH/Caddyfile ]; then rm -rf $DEPLOY_PATH/Caddyfile; fi"
          scp Caddyfile "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/Caddyfile"
          scp docker-compose.prod.yml "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.yml"
          ssh "$SSH_USER@$SSH_HOST" "
            set -e
            cd $DEPLOY_PATH
            test -f .env || { echo 'ERREUR: .env manquant dans $DEPLOY_PATH'; exit 1; }
            docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]{12}_' | xargs -r docker rm -f || true
            docker compose up -d --remove-orphans
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile || docker compose restart caddy
            docker image prune -f
            sleep 25
            docker compose ps
            docker compose logs backend --tail 20
          "